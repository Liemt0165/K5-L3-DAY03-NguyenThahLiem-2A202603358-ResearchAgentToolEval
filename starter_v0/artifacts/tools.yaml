# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng khi thiếu thông tin hoặc cần xác nhận trước khi gửi tin."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text để xin thông tin thiếu, 'yes_no' nếu cần user xác nhận"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn nếu có"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng của một người/tài khoản cụ thể. Không dùng để tìm kiếm theo chủ đề chung"
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng bài cần lấy"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng theo CHỦ ĐỀ/TỪ KHÓA. Không dùng khi lấy bài của một người/tài khoản cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa/chủ đề tìm kiếm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng bài cần lấy"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web hoặc tin tức. Không dùng khi người dùng đã đưa sẵn URL cụ thể"
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại bài viết vừa tìm được"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian tìm kiếm"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một link URL cụ thể. Không dùng khi chưa có link cụ thể (dùng clarify)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Đường link URL đầy đủ"}
      required: [url]

  - name: format
    description: "Định dạng các dữ liệu đã tìm được thành bản tin markdown digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục tin thu thập được"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu khuôn định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi tin lên Telegram. CHỈ DÙNG khi người dùng ĐÃ xác nhận gửi (confirmed=true)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi"}
        confirmed: {type: boolean, default: false, description: "Bắt buộc true khi người dùng đã xác nhận đồng ý gửi"}
      required: [text]

  - name: policy
    description: "Tìm kiếm trong tài liệu quy định và chính sách nội bộ công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tra cứu chính sách"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số lượng mục liên quan nhất"}
      required: [query]

  - name: papers
    description: "Tìm kiếm bài báo nghiên cứu khoa học trên arXiv theo từ khóa."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm bài báo"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo cần lấy"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải và trích xuất nội dung văn bản từ file PDF bài báo arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc đường link arXiv của bài báo"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]

  # ---------------- Team Added Tools ----------------
  - name: github_search
    description: "Tìm kiếm các kho lưu trữ mã nguồn (repositories) công khai trên GitHub theo từ khóa hoặc chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm repository hoặc chủ đề"}
        sort: {type: string, enum: [stars, updated, forks], default: "stars", description: "Sắp xếp theo 'stars', 'updated', hoặc 'forks'"}
        max_results: {type: integer, default: 5, description: "Số lượng repository cần lấy"}
      required: [query]

  - name: deduplicate
    description: "Loại bỏ các nguồn URL trùng lặp khỏi danh sách bài viết/nguồn đã thu thập trước khi tổng hợp bản tin."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Danh sách các item nguồn cần lọc trùng"
          items:
            type: object
            properties:
              url: {type: string, description: "URL nguồn"}
              title: {type: string}
              summary: {type: string}
              source: {type: string}
            required: [url]
      required: [items]

  - name: weather
    description: "Tra cứu thông tin thời tiết hiện tại tại một địa điểm hoặc thành phố cụ thể."
    parameters:
      type: object
      properties:
        location: {type: string, default: "", description: "Tên thành phố hoặc địa điểm cần xem thời tiết (ví dụ: 'Hanoi', 'Tokyo', 'London')"}
      required: [location]
